name: MedAudit AI Quality Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality-tests:
    name: Unit and mobile browser tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright@1.58.2
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Download official WHO ICD-10 Volume 3 PDF for layout regression
        if: ${{ hashFiles('tests/icd10-who-pdf.test.cjs') != '' }}
        run: curl --fail --location --retry 3 --output /tmp/9789241549165-V3-eng.pdf https://iris.who.int/bitstream/10665/246208/3/9789241549165-V3-eng.pdf
      - name: Run unit and browser tests
        env:
          WHO_ICD10_INDEX_PDF: /tmp/9789241549165-V3-eng.pdf
        run: node --test tests/*.test.cjs
