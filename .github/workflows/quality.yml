name: MedAudit AI Quality Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality-tests:
    name: Unit and mobile browser tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright@1.58.2
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run unit and browser tests
        run: node --test tests/*.test.cjs
