name: MedAudit AI Quality Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality-tests:
    name: Unit and mobile browser tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright@1.58.2
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Download WHO 2016 Volume 3 PDF for full-source regression
        run: |
          set -euo pipefail
          urls=(
            "https://apps.who.int/iris/bitstream/handle/10665/246208/9789241549165-V3-eng.pdf?sequence=3&isAllowed=y"
            "https://iris.who.int/bitstream/handle/10665/246208/9789241549165-V3-eng.pdf?sequence=3&isAllowed=y"
            "https://apps.who.int/iris/bitstream/10665/246208/9789241549165-V3-eng.pdf"
          )
          downloaded=false
          for url in "${urls[@]}"; do
            echo "Trying official WHO source: $url"
            rm -f /tmp/9789241549165-V3-eng.pdf
            curl --silent --show-error --location --retry 2 --retry-all-errors --retry-delay 2 \
              --user-agent "Mozilla/5.0" --header "Accept: application/pdf" \
              --output /tmp/9789241549165-V3-eng.pdf "$url" || true
            if [ -s /tmp/9789241549165-V3-eng.pdf ] && \
               [ "$(stat -c%s /tmp/9789241549165-V3-eng.pdf)" -gt 1000000 ] && \
               head -c 5 /tmp/9789241549165-V3-eng.pdf | grep -q "%PDF-"; then
              downloaded=true
              break
            fi
            echo "Not a PDF or file too small; response preview:"
            head -c 500 /tmp/9789241549165-V3-eng.pdf || true
          done
          test "$downloaded" = true
      - name: Run unit and browser tests including the full WHO PDF
        env:
          WHO_ICD10_INDEX_PDF: /tmp/9789241549165-V3-eng.pdf
        run: node --test tests/*.test.cjs
