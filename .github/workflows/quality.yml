name: MedAudit AI Quality Checks

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit-engine-tests:
    name: Audit engine unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run audit engine tests
        run: node --test tests/audit.test.cjs tests/icd10-index.test.cjs
